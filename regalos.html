    <style>
        :root {

            --crema-fondo: #fcfaf7;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Lora', serif;
            background-color: var(--crema-fondo);

            width: 100%;

            text-transform: uppercase;
            letter-spacing: 1px;
